<style>
:root{--ink:#193f36;--red:#a83130;--paper:#fcf7e9;--line:#d3cabb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}header,main,footer{width:min(1180px,92%);margin:auto}header,.section-head,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}header{padding:18px 0;border-bottom:1px solid var(--line)}.brand,h1,h2,h3{font-family:Georgia,serif}.brand{font-size:clamp(21px,3vw,30px);font-weight:bold}.brand b{color:var(--red);margin-right:8px}button,.cta{font:inherit;cursor:pointer;border:1px solid var(--ink);border-radius:24px;padding:9px 17px;background:transparent;color:var(--ink)}button:hover,.cta:hover{background:#e4e8d8}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b46221;outline-offset:3px}.hero{display:grid;grid-template-columns:0.86fr 1.14fr;align-items:center;gap:4%;padding:36px 0}.hero img{display:block;width:100%;aspect-ratio:1.5;object-fit:cover;border:7px solid white;outline:1px solid var(--line);transform:rotate(1deg);box-shadow:0 6px 15px #4b36191c}.hero p{max-width:34ch;margin:15px 0 24px}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:#735e43}h1{font-size:clamp(44px,6vw,86px);font-weight:normal;line-height:1;letter-spacing:-.055em;margin:12px 0}h1 em{color:var(--red)}.cta{display:inline-block;text-decoration:none}.primary,.cta{background:var(--red);color:white;border-color:var(--red)}.primary:hover,.cta:hover{background:#852526}.section-head{border-top:1px solid var(--line);padding:24px 0 16px}h2{font-size:clamp(30px,4vw,46px);line-height:1.1;margin:0;font-weight:normal}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);padding:21px;border-radius:6px;background:#fffdf6;color:var(--ink)}.card:hover{background:#f1eddc}.card small{align-self:flex-start;border-bottom:2px solid #ab813e;padding-bottom:4px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.card h3{font-size:25px;line-height:1.12;margin:20px 0 8px}.card p{margin:0 0 22px}.card strong{margin-top:auto;color:var(--red)}footer{padding:24px 0;color:#605d54;font-size:14px}dialog{background:var(--paper);color:var(--ink);border:0;border-radius:12px;box-shadow:0 16px 75px #193f3640;width:min(510px,94vw);max-height:90vh;padding:24px}dialog::backdrop{background:#102e29ab}dialog h2{font-size:30px}dialog h3{font-size:24px;margin:14px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;margin:14px 0}input,select{min-width:0;width:100%;font:inherit;border:1px solid #aaa797;padding:10px;background:white;color:var(--ink);border-radius:5px}.full{width:100%;margin-top:12px}.item{border-bottom:1px solid var(--line);padding:12px 0}.item p{margin:3px 0 10px}.muted{color:#625f54}.stamp{font-size:22px}.total{font-size:20px;font-weight:bold}.close{padding:6px 12px}.item button{padding:4px 12px}button[hidden]{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.hero{grid-template-columns:1fr;gap:22px;padding:25px 0}.hero img{max-height:280px}.cards{grid-template-columns:1fr}.card{padding:17px}.card h3{margin:10px 0 4px}.card p{margin-bottom:8px}.section-head{display:block}.fields{grid-template-columns:1fr 1fr}dialog{padding:18px}}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth }
  .hero img {
    transform: perspective(950px) rotateX(var(--pitch, 0deg)) rotateY(var(--yaw, 0deg)) rotateZ(1deg);
    transition: transform 240ms ease-out, box-shadow 240ms ease-out;
    animation: postcard-arrival 820ms cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes postcard-arrival {
    from { opacity: 0; transform: perspective(950px) translateY(16px) rotateY(-15deg) rotateZ(-2deg) }
  }
  .card {
    transform-style: preserve-3d;
    transition: transform 240ms ease-out, box-shadow 240ms, background-color 180ms;
  }
  .card h3, .card strong { transform: translateZ(9px) }
  @media (hover: hover) and (pointer: fine) {
    .hero img:hover { box-shadow: 0 16px 28px #4b36192b }
    .card:hover {
      transform: perspective(720px) translateY(-4px) rotateX(var(--pitch, 0deg)) rotateY(var(--yaw, 0deg));
      box-shadow: 0 10px 18px #4b36191c;
    }
  }
  .card:active { transform: perspective(720px) rotateX(-3deg) scale(.985) }
  dialog[open] { animation: unfold 260ms ease-out }
  dialog[open]::backdrop { animation: dim 220ms ease-out }
  @keyframes unfold {
    from { opacity: 0; transform: perspective(800px) translateY(10px) rotateX(-7deg) }
  }
  @keyframes dim { from { opacity: 0 } }
}

<section id="catalog"><div class="section-head"><h2>Программы поздравлений</h2><span>15, 30 или 60 минут</span></div><div class="cards" id="cards"></div></section></main>
<footer>Демонстрационный магазин. Цены примерные, оплата тестовая.</footer>
<dialog id="panel" aria-labelledby="heading"><div class="between"><h2 id="heading"></h2><button class="close" id="close" aria-label="Закрыть окно">Закрыть</button></div><div id="content"></div></dialog>
<script>
const programs=[
 {name:'Дед Мороз',tier:'Стандарт',rate:2500,description:'Поздравление, загадки и вручение вашего подарка.'},
 {name:'Дед Мороз и Снегурочка',tier:'Стандарт',rate:3900,description:'Хоровод у ёлки, игры и поздравление от двух героев.'},
 {name:'Дед Мороз',tier:'VIP',rate:4900,description:'Личная зимняя сказка с вашим ребёнком в главной роли.'},
 {name:'Дед Мороз и Снегурочка',tier:'VIP',rate:6500,description:'Домашний мини-спектакль с играми и волшебным финалом.'}
];
const el=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const dateText=d=>new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const today=new Date();
const season=today.getFullYear();
const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const first=[localDate(today),season+'-12-01'].sort()[1],last=season+'-12-31';
const panel=el('panel'),content=el('content');
let basket=[];
function price(id,date,minutes){
 const day=Number(date.slice(-2));
 const multiplier=day===31?2:day>=28?1.5:day>=25?1.2:1;
 return Math.round(programs[id].rate*multiplier*({15:1,30:1.6,60:2.5}[minutes]));
}
const motionAllowed = matchMedia('(prefers-reduced-motion: no-preference)');
function show(title, html) {
  el('heading').textContent = title;
  content.innerHTML = html;
  if (!panel.open) {
    panel.showModal();
  } else if (motionAllowed.matches) {
    content.getAnimations().forEach(animation => animation.cancel());
    content.animate([
      { opacity: 0, transform: 'translateY(6px)' },
      { opacity: 1, transform: 'translateY(0)' }
    ], { duration: 180, easing: 'ease-out' });
  }
}
function displayCount(){el('count').textContent=basket.length}
function selectProgram(id){
 const p=programs[id];
 show(p.name,'<form id="booking"><p>'+p.tier+' · '+p.description+'</p><div class="fields"><label>Дата визита<input type="date" id="date" required></label><label>Начало<select id="time"></select></label></div><label>Длительность<select id="minutes"><option value="15">15 минут</option><option value="30">30 минут</option><option value="60">60 минут</option></select></label><p class="muted">С 25 декабря действует праздничный тариф. 28 и 31 декабря цена повышается.</p><div class="between"><span>Стоимость визита</span><output class="total" id="quote" aria-live="polite"></output></div><button class="primary full">Добавить в корзину</button></form>');
 const date=el('date'),time=el('time'),minutes=el('minutes');
 date.min=first;date.max=last;date.value=[first,season+'-12-25'].sort()[1];
 for(let h=9;h<=21;h++){const t=String(h).padStart(2,'0')+':00';time.add(new Option(t,t,h===15,h===15))}
 function update(){el('quote').textContent=date.validity.valid?money(price(id,date.value,+minutes.value)):'Выберите дату'}
 date.oninput=minutes.onchange=update;update();
 el('booking').onsubmit=e=>{e.preventDefault();basket.push({id,date:date.value,time:time.value,minutes:+minutes.value});displayCount();openBasket()};
}
function openBasket(){
 show('Корзина','<div id="items"></div>');
 if(!basket.length){content.innerHTML='<p>Корзина пока пуста.</p><button id="back">Выбрать программу</button>';el('back').onclick=()=>{panel.close();el('catalog').scrollIntoView()};return}
 let total=0;
 basket.forEach((item,index)=>{
  const p=programs[item.id],sum=price(item.id,item.date,item.minutes);total+=sum;
  const row=document.createElement('div');row.className='item';
  row.innerHTML='<strong>'+p.name+' · '+p.tier+'</strong><p>'+dateText(item.date)+', '+item.time+' · '+item.minutes+' мин</p><div class="between"><b>'+money(sum)+'</b><button type="button">Удалить</button></div>';
  row.querySelector('button').onclick=()=>{basket.splice(index,1);displayCount();openBasket()};el('items').append(row)
 });
 content.insertAdjacentHTML('beforeend','<p class="total">Итого '+money(total)+'</p><button class="primary full" id="checkout">Перейти к тестовой оплате</button>');
 el('checkout').onclick=()=>{show('Тестовая оплата','<p>К оплате <strong>'+money(total)+'</strong>. В демо деньги не списываются, время визита не бронируется.</p><button class="primary full" id="pay">Оплатить в демо</button><button class="full" id="return">Вернуться в корзину</button>');el('return').onclick=openBasket;el('pay').onclick=()=>{basket=[];displayCount();show('Тестовая оплата прошла','<p>Заказ оформлен в демо. Сумма тестового платежа — '+money(total)+'.</p><button class="primary full" id="done">К программам</button>');el('done').onclick=()=>panel.close()}}
}
programs.forEach((p,i)=>{const card=document.createElement('button');card.className='card';card.innerHTML='<small>'+p.tier+'</small><h3>'+p.name+'</h3><p>'+p.description+'</p><strong>от '+money(p.rate)+'</strong>';card.onclick=()=>selectProgram(i);el('cards').append(card)});
el('close').onclick=()=>panel.close();el('basketButton').onclick=openBasket;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
for (const surface of document.querySelectorAll('.hero img, .card')) {
  surface.addEventListener('pointermove', event => {
    if (!finePointer.matches || !motionAllowed.matches || event.pointerType === 'touch') return;
    const bounds = surface.getBoundingClientRect();
    const x = (event.clientX - bounds.left) / bounds.width - 0.5;
    const y = (event.clientY - bounds.top) / bounds.height - 0.5;
    surface.style.setProperty('--yaw', (x * 12).toFixed(2) + 'deg');
    surface.style.setProperty('--pitch', (-y * 9).toFixed(2) + 'deg');
  });
  surface.addEventListener('pointerleave', () => {
    surface.style.removeProperty('--yaw');
    surface.style.removeProperty('--pitch');
  });
}
</script></body></html>
